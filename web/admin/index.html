<!doctype html>
<html lang="uk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бек-офіс · Дім і Ремонт</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/admin/admin.css">
</head><body>
<div id="login" class="login" hidden>
  <form class="login-box" id="login-form">
    <div class="brand"><span class="logo-mark"></span>Бек-офіс</div>
    <label>Пароль<input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <p class="err" id="login-err" hidden></p>
    <button class="btn" type="submit">Увійти</button>
  </form>
</div>
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><span class="logo-mark"></span>Бек-офіс</div>
    <nav id="nav">
      <a href="#/">Огляд</a>
      <a href="#/orders">Замовлення <span class="pill" id="new-count" hidden></span></a>
      <a href="#/products">Товари</a>
      <a href="#/categories">Категорії і фільтри</a>
      <a href="#/attributes">Характеристики</a>
      <a href="#/reviews">Відгуки <span class="pill" id="rev-count" hidden></span></a>
      <a href="#/pages">Сторінки</a>
      <a href="#/settings">Налаштування</a>
    </nav>
    <div class="side-foot"><a href="/" target="_blank" rel="noopener">Відкрити сайт ↗</a><button type="button" class="link" id="logout">Вийти</button></div>
  </aside>
  <main id="view" class="view"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/admin/admin.js"></script>
</body></html>
